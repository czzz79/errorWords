[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "error-words-tts"
version = "0.1.0"
description = "A small multi-engine TTS generator for ASR error-word experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "cmudict>=1.1.3", "g2p-en>=2.1.0", "pypinyin>=0.55", "tqdm>=4.66"]

[project.optional-dependencies]
qwen = ["qwen-tts"]
azure = ["azure-cognitiveservices-speech"]
dev = ["pytest>=8"]

[project.scripts]
error-words-tts = "error_words_tts.tts.cli:main"
error-words-asr = "error_words_tts.asr_cli:main"
error-words-asr-batch = "error_words_tts.asr_batch_cli:main"
error-words-pronunciation = "error_words_tts.pronunciation.cli:main"
error-words-pronunciation-tts = "error_words_tts.pronunciation.tts_cli:main"
error-words-augment = "error_words_tts.augmentation.cli:main"
error-words-confusions = "error_words_tts.confusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
error_words_tts = [
  "tts/configs/*.json",
  "tts/samples/*.json",
  "pronunciation/configs/*.json",
  "pronunciation/rules/*.json",
  "pronunciation/samples/*.json",
  "augmentation/configs/*.json",
  "confusion/configs/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
